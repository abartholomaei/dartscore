# dartscore – Beispielkonfiguration
# Kopieren nach config.toml und anpassen. Jeder Wert lässt sich per Umgebungsvariable
# überschreiben, z. B. DARTSCORE_SERVER__PORT=9000 oder DARTSCORE_LOGGING__LEVEL=DEBUG.
# Einrichtung der Kameras: docs/hardware-setup.md

# Datenbank, Kalibrierungen, Aufnahmen
data_dir = "data"

[server]
host = "0.0.0.0"
port = 8000

[logging]
level = "INFO"
json_output = false

# Vorschau-Streams im Browser
[stream]
max_fps = 10
default_width = 640
jpeg_quality = 75

# Drei Kameras, ca. 120° versetzt (0 = oben, im Uhrzeigersinn).
# device: stabilen Pfad aus `dartscore devices` nehmen (by-path), nicht /dev/videoN.
# Die Pfade unten passen zum Referenz-Mac-mini (3 Kameras an einem USB-Hub):
# Port 1.2 = oben (0°), Port 1.1 = rechts unten (120°), Port 1.3 = links unten (240°).
# Ohne Hardware: statt device die Zeile source = "synthetic" verwenden.
[[cameras]]
id = "cam1"
device = "/dev/v4l/by-path/pci-0000:00:14.0-usb-0:1.2:1.0-video-index0"
width = 1280
height = 720
fps = 30
fourcc = "MJPG"
position_deg = 0
# Nur Linux (Namen siehe `v4l2-ctl -d <gerät> -l`). exposure_dynamic_framerate = 0 ist wichtig:
# sonst senkt die OV9732 bei wenig Licht die Bildrate auf ~16 fps. Später mit gutem Licht
# zusätzlich feste Belichtung: auto_exposure = 1, exposure_time_absolute = <wert>
v4l2_controls = { exposure_dynamic_framerate = 0 }

[[cameras]]
id = "cam2"
device = "/dev/v4l/by-path/pci-0000:00:14.0-usb-0:1.1:1.0-video-index0"
width = 1280
height = 720
fps = 30
fourcc = "MJPG"
position_deg = 120
v4l2_controls = { exposure_dynamic_framerate = 0 }

[[cameras]]
id = "cam3"
device = "/dev/v4l/by-path/pci-0000:00:14.0-usb-0:1.3:1.0-video-index0"
width = 1280
height = 720
fps = 30
fourcc = "MJPG"
position_deg = 240
v4l2_controls = { exposure_dynamic_framerate = 0 }
