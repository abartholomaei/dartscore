# dartscore - example configuration
# Copy to config.toml and adjust. Any value can be overridden via an environment variable,
# e.g. DARTSCORE_SERVER__PORT=9000 or DARTSCORE_LOGGING__LEVEL=DEBUG.
# Camera setup: docs/hardware-setup.md

# database, calibrations, captures
data_dir = "data"

[server]
host = "0.0.0.0"
port = 8000

[logging]
level = "INFO"
json_output = false

# preview streams in the browser
[stream]
max_fps = 10
default_width = 640
jpeg_quality = 75

# Three cameras, roughly 120° apart (0 = top, clockwise).
# device: use the stable path from `dartscore devices` (by-path), not /dev/videoN.
# The paths below match the reference Mac mini (3 cameras on one USB hub):
# port 1.2 = top (0°), port 1.1 = bottom right (120°), port 1.3 = bottom left (240°).
# Without hardware: use the line source = "synthetic" instead of device.
[[cameras]]
id = "cam1"
device = "/dev/v4l/by-path/pci-0000:00:14.0-usb-0:1.2:1.0-video-index0"
width = 1280
height = 720
fps = 30
fourcc = "MJPG"
position_deg = 0
# Linux only (names: `v4l2-ctl -d <device> -l`). exposure_dynamic_framerate = 0 is important:
# otherwise the OV9732 drops to ~16 fps in low light. Later, with good lighting, also set
# a fixed exposure: auto_exposure = 1, exposure_time_absolute = <value>
v4l2_controls = { exposure_dynamic_framerate = 0 }

[[cameras]]
id = "cam2"
device = "/dev/v4l/by-path/pci-0000:00:14.0-usb-0:1.1:1.0-video-index0"
width = 1280
height = 720
fps = 30
fourcc = "MJPG"
position_deg = 120
v4l2_controls = { exposure_dynamic_framerate = 0 }

[[cameras]]
id = "cam3"
device = "/dev/v4l/by-path/pci-0000:00:14.0-usb-0:1.3:1.0-video-index0"
width = 1280
height = 720
fps = 30
fourcc = "MJPG"
position_deg = 240
v4l2_controls = { exposure_dynamic_framerate = 0 }
