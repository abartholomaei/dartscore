# dartscore – Beispielkonfiguration
# Kopieren nach config.toml und anpassen. Jeder Wert lässt sich per Umgebungsvariable
# überschreiben, z. B. DARTSCORE_SERVER__PORT=9000 oder DARTSCORE_LOGGING__LEVEL=DEBUG.
# Einrichtung der Kameras: docs/hardware-setup.md

# Datenbank, Kalibrierungen, Aufnahmen
data_dir = "data"

[server]
host = "0.0.0.0"
port = 8000

[logging]
level = "INFO"
json_output = false

# Vorschau-Streams im Browser
[stream]
max_fps = 10
default_width = 640
jpeg_quality = 75

# Drei Kameras, ca. 120° versetzt (0 = oben, im Uhrzeigersinn).
# device: stabilen Pfad aus `dartscore devices` nehmen (by-path), nicht /dev/videoN.
# Ohne Hardware: statt device die Zeile source = "synthetic" verwenden.
[[cameras]]
id = "cam1"
device = "/dev/video0"
width = 1280
height = 720
fps = 30
fourcc = "MJPG"
position_deg = 0
# Nur Linux, optional: feste Belichtung (Namen siehe `v4l2-ctl -d <gerät> -l`)
# v4l2_controls = { auto_exposure = 1, exposure_time_absolute = 150 }

[[cameras]]
id = "cam2"
device = "/dev/video2"
width = 1280
height = 720
fps = 30
fourcc = "MJPG"
position_deg = 120

[[cameras]]
id = "cam3"
device = "/dev/video4"
width = 1280
height = 720
fps = 30
fourcc = "MJPG"
position_deg = 240
